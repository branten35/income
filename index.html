<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Дневник дохода</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #efeff4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-accent-text-color, var(--tg-theme-button-color, #2481cc));
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --soft: color-mix(in srgb, var(--accent) 12%, transparent);
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding: 10px 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sep);
    border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button { padding: 7px 4px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg.small button { padding: 5px 4px; font-size: 13px; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; gap: 8px; }
  .nav .arrow { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); font-size: 22px; }
  .nav .arrow:active { background: var(--soft); }
  .nav .label { flex: 1; text-align: center; font-weight: 600; font-size: 17px; position: relative; }
  .nav .label input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .nav .label small { display: block; font-weight: 400; font-size: 13px; color: var(--hint); }
  .period { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 6px; }
  .period label { font-size: 12px; color: var(--hint); display: grid; gap: 4px; }
  input[type=date], input[type=text] { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--sep);
    border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }

  .hero { background: var(--card); border-radius: var(--radius); padding: 16px 16px 14px; margin-top: 10px; }
  .hero .total { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .hero .sub { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--sep); border-radius: 10px; overflow: hidden; margin-top: 12px; }
  .stats div { background: var(--card); padding: 8px 0 2px; }
  .stats div + div { padding-left: 14px; }
  .stats b { display: block; font-size: 17px; }
  .stats span { color: var(--hint); font-size: 12px; }

  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--hint); font-weight: 500; margin: 20px 4px 6px; }
  .list { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; text-align: left; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 1px solid var(--sep); }
  .row:active { background: var(--soft); }
  .row .main { flex: 1; min-width: 0; }
  .row .main small { display: block; color: var(--hint); font-size: 13px; }
  .row .amt { font-weight: 600; white-space: nowrap; }
  .row .chev { color: var(--hint); font-size: 18px; margin-left: 2px; }
  .row .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--soft); z-index: 0; pointer-events: none; }
  .row > *:not(.bar) { position: relative; z-index: 1; }
  .row.muted .amt { color: var(--hint); font-weight: 400; }
  .empty { padding: 22px 14px; color: var(--hint); text-align: center; font-size: 15px; }
  .addrow { color: var(--accent); font-weight: 500; }

  .fab { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); height: 50px;
    border-radius: 12px; background: var(--btn); color: var(--btn-text); font-weight: 600; font-size: 16px; }
  .fab:active { opacity: .85; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { background: var(--bg); width: 100%; border-radius: 16px 16px 0 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom, 0px));
    animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(30%); opacity: .4; } to { transform: none; opacity: 1; } }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; text-align: center; }
  .sheet label { display: grid; gap: 4px; font-size: 13px; color: var(--hint); margin-bottom: 10px; }
  .sheet input.amount { font-size: 26px; font-weight: 600; text-align: center; }
  .sheet .warn { font-size: 13px; color: var(--danger); margin: -4px 2px 10px; }
  .sheet .err { font-size: 13px; color: var(--danger); min-height: 18px; margin: -4px 2px 6px; }
  .btns { display: grid; gap: 8px; }
  .btn { height: 48px; border-radius: 12px; font-weight: 600; }
  .btn.primary { background: var(--btn); color: var(--btn-text); }
  .btn.ghost { background: var(--card); }
  .btn.danger { background: var(--card); color: var(--danger); }
  .btn:disabled { opacity: .5; }

  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: 90vw; text-align: center; }
  .notice { background: var(--card); border-radius: var(--radius); padding: 20px 16px; margin-top: 30px; text-align: center; }
  .notice h2 { margin: 0 0 8px; font-size: 18px; }
  .notice p { color: var(--hint); margin: 0; }
  .loading { opacity: .55; transition: opacity .15s; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="seg" id="modes" role="tablist">
    <button data-mode="day" aria-pressed="true">День</button>
    <button data-mode="month" aria-pressed="false">Месяц</button>
    <button data-mode="year" aria-pressed="false">Год</button>
    <button data-mode="range" aria-pressed="false">Период</button>
  </div>

  <div class="nav" id="nav">
    <button class="arrow" id="prev" aria-label="Назад">‹</button>
    <div class="label" id="navLabel"></div>
    <button class="arrow" id="next" aria-label="Вперёд">›</button>
  </div>
  <div class="seg small" id="yearKind" hidden>
    <button data-fiscal="1" aria-pressed="true">июнь – май</button>
    <button data-fiscal="0" aria-pressed="false">январь – декабрь</button>
  </div>
  <div class="period" id="period" hidden>
    <label>С <input type="date" id="from"></label>
    <label>По <input type="date" id="to"></label>
  </div>

  <div class="hero" id="hero">
    <div class="total num" id="total">—</div>
    <div class="sub" id="sub">&nbsp;</div>
    <div class="stats" id="stats" hidden>
      <div><b class="num" id="avg">—</b><span>в среднем за рабочий день</span></div>
      <div><b class="num" id="worked">—</b><span>рабочих дней</span></div>
    </div>
  </div>

  <h3 id="listTitle"></h3>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="fab">+ Добавить запись</button>
<div id="notice" hidden></div>

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  var params = new URLSearchParams(location.search);
  var API = params.get('api') || '';
  var initData = tg ? tg.initData : '';

  var MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var WD = ['вс','пн','вт','ср','чт','пт','сб'];

  // ---------- даты (строки YYYY-MM-DD, считаем в UTC, чтобы не мешали часовые пояса)
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function todayIso() { var d = new Date(); return iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  function toDate(s) { return new Date(s + 'T12:00:00Z'); }
  function fromDate(d) { return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  function addDays(s, n) { var d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return fromDate(d); }
  function addMonths(s, n) { var y = +s.slice(0, 4), m = +s.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return iso(y, m + 1, 1); }
  function lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function fy(s) { var y = +s.slice(0, 4), m = +s.slice(5, 7); return m >= 6 ? y : y - 1; }
  function human(s, withYear) { var d = toDate(s); return d.getUTCDate() + ' ' + MONTHS_GEN[d.getUTCMonth()] + (withYear ? ' ' + d.getUTCFullYear() : '') + ', ' + WD[d.getUTCDay()]; }
  function short(s) { var d = toDate(s); return pad(d.getUTCDate()) + '.' + pad(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear(); }
  function eachDay(from, to, fn) { for (var s = from; s <= to; s = addDays(s, 1)) fn(s); }
  function rub(n) { return Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' ') + ' ₽'; }
  function plural(n, a, b, c) { n = Math.abs(n) % 100; var n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- состояние
  var today = todayIso();
  var state = {
    mode: 'day',
    day: today,
    month: today.slice(0, 8) + '01',
    year: fy(today),          // начало учётного года (июнь) или календарный год
    fiscal: true,
    from: addDays(today, -29),
    to: today,
  };
  var cache = {};             // iso -> [суммы]
  var complex = {};           // iso -> true, если в ячейке «своя» формула
  var loadedFY = {};          // год -> true | Promise
  var knownYears = null;

  // ---------- API
  function api(action, body) {
    var payload = Object.assign({ action: action, initData: initData }, body || {});
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) {
          var map = {
            auth: 'Не удалось подтвердить вход. Закройте и откройте дневник заново из бота.',
            forbidden: 'Это личный дневник.',
            no_owner: 'Сначала напишите боту /start.',
            bad_amount: 'Проверьте сумму.',
          };
          throw new Error(map[j.error] || j.error || 'Ошибка');
        }
        return j;
      });
  }

  function ensureFY(y) {
    if (loadedFY[y] === true) return Promise.resolve();
    if (loadedFY[y]) return loadedFY[y];
    var p = api('range', { from: iso(y, 6, 1), to: iso(y + 1, 5, 31) }).then(function (r) {
      knownYears = r.years;
      eachDay(iso(y, 6, 1), iso(y + 1, 5, 31), function (s) { delete cache[s]; delete complex[s]; });
      Object.keys(r.days).forEach(function (k) { cache[k] = r.days[k]; });
      Object.keys(r.complex || {}).forEach(function (k) { complex[k] = true; });
      loadedFY[y] = true;
    }).catch(function (e) { delete loadedFY[y]; throw e; });
    loadedFY[y] = p;
    return p;
  }

  function ensureRange(from, to) {
    var ys = [];
    for (var y = fy(from); y <= fy(to); y++) ys.push(ensureFY(y));
    return Promise.all(ys);
  }

  // ---------- текущий диапазон
  function currentRange() {
    switch (state.mode) {
      case 'day': return { from: state.day, to: state.day };
      case 'month': {
        var y = +state.month.slice(0, 4), m = +state.month.slice(5, 7);
        return { from: state.month, to: iso(y, m, lastDay(y, m)) };
      }
      case 'year':
        return state.fiscal ? { from: iso(state.year, 6, 1), to: iso(state.year + 1, 5, 31) }
                            : { from: iso(state.year, 1, 1), to: iso(state.year, 12, 31) };
      default: {
        var a = state.from <= state.to ? state.from : state.to, b = state.from <= state.to ? state.to : state.from;
        return { from: a, to: b };
      }
    }
  }

  function daySum(s) { return (cache[s] || []).reduce(function (a, b) { return a + b; }, 0); }

  function stats(from, to) {
    var sum = 0, worked = 0, days = 0;
    var end = to < today ? to : today;
    eachDay(from, to, function (s) { var v = daySum(s); sum += v; if (v > 0) worked++; if (s <= end) days++; });
    return { sum: sum, worked: worked, days: days, avg: worked ? sum / worked : 0 };
  }

  // ---------- отрисовка
  var $ = function (id) { return document.getElementById(id); };

  function renderControls() {
    document.querySelectorAll('#modes button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)); });
    document.querySelectorAll('#yearKind button').forEach(function (b) { b.setAttribute('aria-pressed', String((b.dataset.fiscal === '1') === state.fiscal)); });
    $('nav').hidden = state.mode === 'range';
    $('period').hidden = state.mode !== 'range';
    $('yearKind').hidden = state.mode !== 'year';
    $('stats').hidden = state.mode === 'day';
    var label = $('navLabel');
    if (state.mode === 'day') {
      label.innerHTML = esc(human(state.day)) + '<small>' + (state.day === today ? 'сегодня' : state.day.slice(0, 4)) + '</small>' +
        '<input type="date" id="pickDay" value="' + state.day + '" aria-label="Выбрать дату">';
      $('pickDay').addEventListener('change', function (e) { if (e.target.value) { state.day = e.target.value; render(); } });
    } else if (state.mode === 'month') {
      var m = +state.month.slice(5, 7);
      label.innerHTML = esc(MONTHS[m - 1][0].toUpperCase() + MONTHS[m - 1].slice(1)) + '<small>' + state.month.slice(0, 4) + '</small>';
    } else if (state.mode === 'year') {
      label.innerHTML = state.fiscal ? state.year + '/' + String(state.year + 1).slice(2) + '<small>июнь ' + state.year + ' – май ' + (state.year + 1) + '</small>'
                                     : state.year + '<small>январь – декабрь</small>';
    }
    $('from').value = state.from; $('to').value = state.to;
  }

  function renderBody() {
    var r = currentRange(), st = stats(r.from, r.to);
    $('total').textContent = rub(st.sum);
    var list = $('list'), html = '';

    if (state.mode === 'day') {
      var e = cache[state.day] || [];
      $('sub').textContent = e.length > 1 ? e.length + ' ' + plural(e.length, 'поступление', 'поступления', 'поступлений') : (e.length ? 'одно поступление' : 'нет записей');
      $('listTitle').textContent = 'Поступления';
      e.forEach(function (v, i) {
        html += '<button class="row" data-edit="' + i + '"><div class="main num">' + rub(v) + '<small>' + (complex[state.day] ? 'своя формула в ячейке' : (e.length > 1 ? 'поступление ' + (i + 1) : 'нажмите, чтобы изменить')) + '</small></div><span class="chev">›</span></button>';
      });
      html += '<button class="row addrow" data-add="1">+ Добавить поступление</button>';
    } else if (state.mode === 'year') {
      $('listTitle').textContent = 'По месяцам';
      var months = [], start = state.fiscal ? iso(state.year, 6, 1) : iso(state.year, 1, 1);
      for (var k = 0; k < 12; k++) {
        var ms = addMonths(start, k), y = +ms.slice(0, 4), m = +ms.slice(5, 7);
        months.push({ ms: ms, st: stats(ms, iso(y, m, lastDay(y, m))) });
      }
      var max = Math.max.apply(null, months.map(function (x) { return x.st.sum; }).concat([1]));
      var best = months.filter(function (x) { return x.st.sum === max; })[0];
      $('sub').textContent = best && best.st.sum ? 'лучший месяц — ' + MONTHS[+best.ms.slice(5, 7) - 1] + ', ' + rub(best.st.sum) : 'нет записей';
      months.forEach(function (x) {
        var m = +x.ms.slice(5, 7);
        html += '<button class="row' + (x.st.sum ? '' : ' muted') + '" data-month="' + x.ms + '"><span class="bar" style="width:' + (x.st.sum / max * 100).toFixed(1) + '%"></span>' +
          '<div class="main">' + MONTHS[m - 1][0].toUpperCase() + MONTHS[m - 1].slice(1) + ' ' + x.ms.slice(0, 4) +
          '<small class="num">' + (x.st.worked ? 'сред. ' + rub(x.st.avg) + ' · ' + x.st.worked + ' ' + plural(x.st.worked, 'день', 'дня', 'дней') : 'нет записей') + '</small></div>' +
          '<span class="amt num">' + rub(x.st.sum) + '</span><span class="chev">›</span></button>';
      });
    } else {
      $('sub').textContent = state.mode === 'range' ? short(r.from) + ' — ' + short(r.to) : '';
      $('listTitle').textContent = 'По дням';
      var rows = [];
      eachDay(r.from, r.to, function (s) { if (daySum(s) > 0) rows.push(s); });
      rows.reverse().forEach(function (s) {
        var e = cache[s];
        html += '<button class="row" data-day="' + s + '"><div class="main">' + esc(human(s, state.mode === 'range')) +
          (e.length > 1 ? '<small class="num">' + e.map(rub).join(' + ') + '</small>' : '') + '</div>' +
          '<span class="amt num">' + rub(daySum(s)) + '</span><span class="chev">›</span></button>';
      });
      if (!rows.length) html = '<div class="empty">Нет записей за этот период</div>';
    }

    if (state.mode !== 'day') {
      $('avg').textContent = st.worked ? rub(st.avg) : '—';
      $('worked').textContent = st.worked + (st.days ? ' из ' + st.days : '');
    }
    if (knownYears && knownYears.indexOf(fy(r.to)) < 0 && knownYears.indexOf(fy(r.from)) < 0) {
      html = '<div class="empty">В таблице ещё нет блока на ' + fy(r.from) + '/' + String(fy(r.from) + 1).slice(2) + ' год</div>';
    }
    list.innerHTML = html;
  }

  var renderSeq = 0;
  function render() {
    renderControls();
    var r = currentRange(), seq = ++renderSeq;
    var ready = true;
    for (var y = fy(r.from); y <= fy(r.to); y++) if (loadedFY[y] !== true) ready = false;
    if (ready) { renderBody(); return; }
    document.body.classList.add('loading');
    ensureRange(r.from, r.to).then(function () {
      if (seq === renderSeq) { document.body.classList.remove('loading'); renderBody(); }
    }).catch(function (e) {
      document.body.classList.remove('loading');
      toast(e.message);
    });
  }

  // ---------- навигация
  function shift(dir) {
    if (state.mode === 'day') state.day = addDays(state.day, dir);
    else if (state.mode === 'month') state.month = addMonths(state.month, dir);
    else if (state.mode === 'year') state.year += dir;
    haptic('selection');
    render();
  }
  $('prev').addEventListener('click', function () { shift(-1); });
  $('next').addEventListener('click', function () { shift(1); });
  document.querySelectorAll('#modes button').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.dataset.mode;
      if (m === 'month' && state.mode === 'day') state.month = state.day.slice(0, 8) + '01';
      if (m === 'year' && state.mode !== 'year') state.year = state.fiscal ? fy(state.mode === 'month' ? state.month : state.day) : +(state.mode === 'month' ? state.month : state.day).slice(0, 4);
      state.mode = m; haptic('selection'); render();
    });
  });
  document.querySelectorAll('#yearKind button').forEach(function (b) {
    b.addEventListener('click', function () {
      var f = b.dataset.fiscal === '1';
      if (f !== state.fiscal) { state.fiscal = f; state.year = f ? fy(today) : +today.slice(0, 4); render(); }
    });
  });
  $('from').addEventListener('change', function (e) { if (e.target.value) { state.from = e.target.value; render(); } });
  $('to').addEventListener('change', function (e) { if (e.target.value) { state.to = e.target.value; render(); } });

  $('list').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.day) { state.day = b.dataset.day; state.mode = 'day'; render(); }
    else if (b.dataset.month) { state.month = b.dataset.month; state.mode = 'month'; render(); }
    else if (b.dataset.edit !== undefined) openSheet(state.day, +b.dataset.edit);
    else if (b.dataset.add) openSheet(state.day, null);
  });
  $('fab').addEventListener('click', function () { openSheet(state.mode === 'day' ? state.day : today, null); });

  // ---------- окно добавления / правки
  var sheetEl = null;
  function closeSheet() {
    if (sheetEl) { sheetEl.remove(); sheetEl = null; }
    if (tg && tg.BackButton) tg.BackButton.hide();
  }
  function openSheet(date, index) {
    closeSheet();
    var editing = index !== null && index !== undefined;
    var before = (cache[date] || []).slice();
    var value = editing ? before[index] : '';
    var bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<h2>' + (editing ? 'Изменить запись' : 'Новая запись') + '</h2>' +
        '<label>Дата<input type="date" id="fDate" value="' + date + '"></label>' +
        '<label>Сумма, ₽<input type="text" class="amount num" id="fAmount" inputmode="decimal" autocomplete="off" placeholder="0" value="' + (value ? String(value) : '') + '"></label>' +
        (editing && complex[date] ? '<div class="warn">В этой ячейке своя формула — после сохранения вместо неё будет число.</div>' : '') +
        '<div class="err" id="fErr"></div>' +
        '<div class="btns">' +
          '<button class="btn primary" id="fSave">Сохранить</button>' +
          (editing ? '<button class="btn danger" id="fDel">Удалить</button>' : '') +
          '<button class="btn ghost" id="fCancel">Отмена</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bg);
    sheetEl = bg;
    if (tg && tg.BackButton) { tg.BackButton.show(); }
    bg.addEventListener('click', function (e) { if (e.target === bg) closeSheet(); });
    $('fCancel').addEventListener('click', closeSheet);
    var amountEl = $('fAmount');
    setTimeout(function () { amountEl.focus(); if (editing) amountEl.select(); }, 60);
    amountEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });

    function parseAmount(s) {
      var t = String(s).replace(/[\s ₽]/g, '');
      if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
      t = t.replace(',', '.');
      var n = Number(t);
      return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null;
    }
    function busy(on) { ['fSave', 'fDel', 'fCancel'].forEach(function (id) { var el = $(id); if (el) el.disabled = on; }); }
    function done(res, msg, focusDate) {
      apply(res);
      closeSheet();
      haptic('success');
      toast(msg);
      if (focusDate) { state.day = focusDate; if (state.mode === 'day') {} }
      render();
    }
    function fail(e) { busy(false); $('fErr').textContent = e.message; haptic('error'); }

    function save() {
      var amount = parseAmount(amountEl.value);
      var newDate = $('fDate').value;
      if (!amount) { $('fErr').textContent = 'Введите сумму больше нуля'; amountEl.focus(); return; }
      if (!newDate) { $('fErr').textContent = 'Выберите дату'; return; }
      busy(true);
      var p = editing
        ? api('update', { date: date, index: index, amount: amount, newDate: newDate, expect: before })
        : api('add', { date: newDate, amount: amount });
      p.then(function (res) {
        if (res.conflict) { apply(res); busy(false); render(); $('fErr').textContent = 'Пока вы редактировали, запись изменилась. Проверьте и сохраните ещё раз.'; return; }
        done(res, (editing ? 'Сохранено: ' : 'Добавлено: ') + rub(amount) + ' · ' + short(newDate), newDate);
      }).catch(fail);
    }
    $('fSave').addEventListener('click', save);
    if (editing) {
      $('fDel').addEventListener('click', function () {
        busy(true);
        api('delete', { date: date, index: index, expect: before }).then(function (res) {
          if (res.conflict) { apply(res); busy(false); render(); $('fErr').textContent = 'Запись уже изменилась — проверьте список.'; return; }
          done(res, 'Удалено: ' + rub(value));
        }).catch(fail);
      });
    }
  }

  function applyDay(d) {
    if (!d || !d.date) return;
    if (d.entries && d.entries.length) cache[d.date] = d.entries; else delete cache[d.date];
    delete complex[d.date];
  }
  function apply(res) {
    if (res.moved) { applyDay(res.from); applyDay(res.to); } else applyDay(res);
  }

  // ---------- мелочи
  var toastTimer;
  function toast(text) {
    var el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = text;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.remove(); }, 2600);
  }
  function haptic(kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === 'selection') tg.HapticFeedback.selectionChanged();
      else tg.HapticFeedback.notificationOccurred(kind);
    } catch (e) {}
  }
  function notice(title, text) {
    $('app').hidden = true; $('fab').hidden = true;
    var n = $('notice'); n.hidden = false; n.className = 'notice';
    n.innerHTML = '<h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>';
  }

  // ---------- старт
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.BackButton) tg.BackButton.onClick(closeSheet);
    if (tg.onEvent) tg.onEvent('activated', function () { loadedFY = {}; render(); });
  }
  if (!API) { notice('Не указан адрес скрипта', 'Откройте дневник кнопкой в боте — она передаёт адрес автоматически.'); return; }
  if (!initData) { notice('Откройте через Telegram', 'Дневник работает внутри бота: нажмите «Дневник» рядом с полем ввода сообщения.'); return; }
  render();
})();
</script>
</body>
</html>
